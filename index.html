
<html>
<head>
    <title>Online Examination System</title>
</head>
<body>
    <h2>Online Examination System</h2>

    <input id="name" placeholder="Student Name">
    <button onclick="login()">Login</button>

    <div id="exam" style="display:none">
        <h3>Welcome <span id="student"></span></h3>

        <p>1. Which language is used for web development?</p>
        <input type="radio" name="q1" value="1"> HTML
        <input type="radio" name="q1" value="0"> C

        <p>2. Which is a programming language?</p>
        <input type="radio" name="q2" value="1"> Java
        <input type="radio" name="q2" value="0"> HTML

        <br><br>
        <button onclick="result()">Submit</button>
        <p id="score"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
